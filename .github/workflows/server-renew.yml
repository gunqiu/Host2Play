```yaml
name: Auto Renew Server Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run-renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      ########################################################
      # 安装系统依赖
      ########################################################
      - name: Install System Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            ffmpeg \
            unzip \
            curl \
            wget \
            gnupg \
            ca-certificates

          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -

          sudo sh -c '
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
          > /etc/apt/sources.list.d/google-chrome.list'

          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      ########################################################
      # 安装 WARP
      ########################################################
      - name: Install WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | \
          sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] \
          https://pkg.cloudflareclient.com/ jammy main" | \
          sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          sudo warp-cli --accept-tos register
          sudo warp-cli --accept-tos set-mode proxy
          sudo warp-cli --accept-tos set-proxy-port 40000

          sudo warp-cli --accept-tos connect

          sleep 10

          echo "===== WARP STATUS ====="
          warp-cli --accept-tos status || true

      ########################################################
      # 启动 Xray VMess
      ########################################################
      - name: Start Xray VMess
        run: |
          mkdir -p xray-core
          cd xray-core

          wget -O xray.zip \
          https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip

          unzip -oq xray.zip

          chmod +x xray

          cat > config.json << 'EOF'
          {
            "log": {
              "loglevel": "warning"
            },

            "inbounds": [
              {
                "tag": "socks-in",
                "port": 10808,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": {
                  "udp": true
                }
              }
            ],

            "outbounds": [
              {
                "tag": "vmess-out",
                "protocol": "vmess",

                "settings": {
                  "vnext": [
                    {
                      "address": "saas.sin.fan",
                      "port": 443,

                      "users": [
                        {
                          "id": "a6a300d5-c9f4-4d84-b4d3-6857f721c203",
                          "alterId": 0,
                          "security": "auto"
                        }
                      ]
                    }
                  ]
                },

                "streamSettings": {
                  "network": "ws",
                  "security": "tls",

                  "tlsSettings": {
                    "serverName": "freeserver.ccuu.de5.net",
                    "allowInsecure": false
                  },

                  "wsSettings": {
                    "path": "/vmess-argo?ed=2560",

                    "headers": {
                      "Host": "freeserver.ccuu.de5.net"
                    }
                  }
                },

                "proxySettings": {
                  "tag": "warp"
                }
              },

              {
                "tag": "warp",
                "protocol": "socks",

                "settings": {
                  "servers": [
                    {
                      "address": "127.0.0.1",
                      "port": 40000
                    }
                  ]
                }
              }
            ]
          }
          EOF

          nohup ./xray run -config config.json > ../xray.log 2>&1 &

          sleep 8

          echo "===== XRAY LOG ====="
          cat ../xray.log || true

      ########################################################
      # 启动 Gost 本地代理
      ########################################################
      - name: Start Gost Forward Proxy
        run: |
          wget https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz

          gunzip gost-linux-amd64-2.11.5.gz

          chmod +x gost-linux-amd64-2.11.5

          mv gost-linux-amd64-2.11.5 gost

          echo "启动 Gost..."

          nohup ./gost \
            -L=http://127.0.0.1:8080 \
            -F=socks5://127.0.0.1:10808 \
            > gost.log 2>&1 &

          sleep 5

          echo "===== GOST LOG ====="
          cat gost.log || true

      ########################################################
      # 测试代理
      ########################################################
      - name: Test Proxy
        run: |
          echo "===== TEST IP ====="

          curl \
            -x http://127.0.0.1:8080 \
            https://api.ipify.org \
            --max-time 30 \
            -v

      ########################################################
      # 安装 Python 依赖
      ########################################################
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            DrissionPage \
            xvfbwrapper \
            requests \
            SpeechRecognition \
            pydub \
            pysocks

      ########################################################
      # 运行脚本
      ########################################################
      - name: Run Renew Script
        env:
          RENEW_URL: ${{ secrets.RENEW_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          ALL_PROXY: http://127.0.0.1:8080
          HTTP_PROXY: http://127.0.0.1:8080
          HTTPS_PROXY: http://127.0.0.1:8080

          PROXY: http://127.0.0.1:8080

        run: |
          echo "===== START SCRIPT ====="

          python main.py

      ########################################################
      # 上传日志
      ########################################################
      - name: Upload Debug Files
        uses: actions/upload-artifact@v4
        if: always()

        with:
          name: debug-files

          path: |
            ./*.html
            ./*.png
            *.log
            xray.log
            gost.log

          retention-days: 5
```
