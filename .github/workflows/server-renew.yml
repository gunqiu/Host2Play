name: Auto Renew Server Script

on:
workflow_dispatch:
schedule:
- cron: '0 */3 * * *'

jobs:
run-renew:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install System Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y xvfb ffmpeg unzip

      wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -

      sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'

      sudo apt-get update
      sudo apt-get install -y google-chrome-stable

  - name: Install Python Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

  - name: 测试 SOCKS5 代理
    run: |
      curl --socks5 ${{ secrets.PROXY_IP }} https://api.ipify.org

  - name: Run Renew Script
    env:
      RENEW_URL: ${{ secrets.RENEW_URL }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # 直接 SOCKS5
      PROXY: socks5://${{ secrets.PROXY_IP }}

    run: python main.py

  - name: Upload Error HTML
    uses: actions/upload-artifact@v4
    if: always()
    with:
      name: debug-html
      path: ./*.html
      retention-days: 5
```
