name: Auto Renew Server Script

on:
  workflow_dispatch:  # 支持手动触发
  schedule:
    - cron: '0 */3 * * *'  # 每3小时自动运行一次

jobs:
  run-renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get install -y google-chrome-stable

      - name: 🛡️ 启动 VMess 代理
        run: |
          # 下载并启动 Xray
          wget -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip xray.zip
          chmod +x xray

          # 写入配置（你的 VMess 节点信息）
          cat > config.json << EOF
          {
            "inbounds": [
              {
                "port": 10800,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "settings": {
                  "auth": "noauth",
                  "udp": true
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "vmess",
                "settings": {
                  "vnext": [
                    {
                      "address": "saas.sin.fan",
                      "port": 443,
                      "users": [
                        {
                          "id": "a6a300d5-c9f4-4d84-b4d3-6857f721c203",
                          "alterId": 0
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "tlsSettings": {
                    "serverName": "freeserver.ccuu.de5.net",
                    "allowInsecure": false
                  },
                  "wsSettings": {
                    "headers": {
                      "Host": "freeserver.ccuu.de5.net"
                    },
                    "path": "/vmess-argo?ed=2560"
                  }
                }
              }
            ]
          }
          EOF

          # 后台启动代理
          nohup ./xray run -c config.json > xray.log 2>&1 &
          sleep 5

          # 测试代理是否生效
          curl --socks5 127.0.0.1:10800 https://api.ipify.org -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      - name: Run Renew Script
        run: python main.py

      - name: Upload Error Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshots
          path: ./*.html
          retention-days: 5
